<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header {
            background-color: #E8C5E8;
            color #300D28;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            border: 5px solid rgb(248, 183, 248);
            padding:16px;
        }
        main{
            background-color: #e6b8e6;
            color: #45113A;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            p.autor{ 
                font-weight: bold;
            }
        }
        img {
            width: 80px;
            height: 80px;
        }
    </style>
</head>
<body>
    <header>
         <h1>SAROBA</h1> 
        <p>Bate estaca</p> 
    </header>
   <main>
        <img src="imagem.png" alt="imagem de um canteiro de flor com animal";>
        <div>
        <h2>saroba </h2>
        <p class="autor">por:Evelyn Soares</p>
        <p>te amo Guilherme Henrique Soares </p>
        <button>🌷<span>0</span></button>
        </div>
   </main>
</body>
<script>
    const botao = document.querySelector("button")
    botao.addEventListener("click", botaoClicado)
    function botaoClicado() {
        let texto = botao.querySelector("span")
        texto.textContent++;
    }
</script>
</html>
